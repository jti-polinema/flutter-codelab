<h1 id="week-4">Week 4</h1>
<h2 id="networking--rest-api">Networking &amp; REST API</h2>
<p><strong>Mobile Programming</strong></p>
<p>Flutter • Dio • REST API • JSON</p>
<blockquote>
<p>From local data → apps that communicate with a backend</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="learning-outcomes">Learning Outcomes</h1>
<p>After this session, students will be able to:</p>
<ol>
<li>Explain HTTP, REST API, and JSON concepts.</li>
<li>Create data models and <code>fromJson</code>/<code>toJson</code> serialization.</li>
<li>Implement API requests using <code>Dio</code>.</li>
<li>Apply the basic repository pattern for the data layer.</li>
<li>Handle loading, data, error, and empty states.</li>
<li>Implement basic pagination.</li>
<li>Verify AI-generated networking code.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="why-networking">Why Networking?</h1>
<p>Week 3 apps stored data locally.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Without backend:
UI ←→ Provider ←→ Memory
</code></pre>
<p>Real apps need server data:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">With backend:
Flutter → Dio → REST API
  → Database → Back as JSON
</code></pre>
<p><strong>Goal:</strong> the UI never talks directly to the internet, but through a repository.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="mini-poll">Mini Poll</h1>
<h3 id="if-a-product-api-takes-5-seconds">If a product API takes 5 seconds...</h3>
<p>What should the user see?</p>
<p><strong>A.</strong> Blank screen with no info<br />
<strong>B.</strong> Frozen / crashing app<br />
<strong>C.</strong> Clear loading indicator<br />
<strong>D.</strong> Ask AI to speed up the internet</p>
<h3 id="discussion">Discussion</h3>
<blockquote>
<p>What is wrong with calling <code>http.get()</code> directly inside <code>build()</code>?</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="part-1">Part 1</h1>
<h2 id="http--rest-api">HTTP &amp; REST API</h2>
<h1 id="what-is-http">What Is HTTP?</h1>
<p>HTTP is a request–response protocol.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Client (Flutter)
  │  GET /products
  ↓
Server (REST API)
  │  200 OK + JSON
  ↓
Client displays data
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<p>Main methods:</p>
<table>
<thead>
<tr>
<th>Method</th>
<th>Purpose</th>
</tr>
</thead>
<tbody>
<tr>
<td>GET</td>
<td>Read data</td>
</tr>
<tr>
<td>POST</td>
<td>Create data</td>
</tr>
<tr>
<td>PUT/PATCH</td>
<td>Update data</td>
</tr>
<tr>
<td>DELETE</td>
<td>Delete data</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="what-is-rest-api">What Is REST API?</h1>
<p>REST exposes resources through URLs.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">GET    /products       → product list
GET    /products/101   → product detail
POST   /products       → add product
PUT    /products/101   → update product
DELETE /products/101   → delete product
</code></pre>
<p>Responses use status codes:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">200 OK
201 Created
400 Bad Request
401 Unauthorized
404 Not Found
500 Server Error
</code></pre>
<blockquote>
<p>The frontend must handle every status, not only 200.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="what-is-json">What Is JSON?</h1>
<p>JSON is the text data format sent by APIs.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">101</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;title&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Milk Coffee&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;price&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">18000</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;inStock&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-literal"><span class="hljs-keyword">true</span></span>
<span class="hljs-punctuation">}</span>
</code></pre>
<p>In Dart it becomes <code>Map&lt;String, dynamic&gt;</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">final</span> map = <span class="hljs-title function_">jsonDecode</span>(responseBody);
<span class="hljs-keyword">final</span> title = map[<span class="hljs-string">&#x27;title&#x27;</span>] <span class="hljs-keyword">as</span> <span class="hljs-title class_">String</span>;
</code></pre>
<p>Practical rules:</p>
<ul>
<li>keys are <code>String</code></li>
<li>values can be <code>String</code>, <code>num</code>, <code>bool</code>, <code>List</code>, <code>Map</code>, <code>null</code></li>
<li>always validate types before use</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="part-2">Part 2</h1>
<h2 id="models--serialization">Models &amp; Serialization</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="why-do-we-need-models">Why Do We Need Models?</h1>
<p>Without models, code is full of raw strings:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-title class_">Text</span>(item[<span class="hljs-string">&#x27;titel&#x27;</span>].<span class="hljs-title function_">toString</span>()) <span class="hljs-comment">// typo = null</span>
</code></pre>
<p>With models, structure is explicit and safe:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-title class_">Text</span>(product.title)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">JSON (Map)
   ↓ fromJson
Product (Object)
   ↓ toJson
JSON (Map)
</code></pre>
<p><strong>Principle:</strong> JSON parsing happens in only one place the model.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="example-product-model">Example Product Model</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Product</span> </span>{
  <span class="hljs-keyword">final</span> <span class="hljs-built_in">int</span> id;
  <span class="hljs-keyword">final</span> <span class="hljs-title class_">String</span> title;
  <span class="hljs-keyword">final</span> <span class="hljs-built_in">double</span> price;

  <span class="hljs-keyword">const</span> <span class="hljs-title class_">Product</span>({
    <span class="hljs-keyword">required</span> <span class="hljs-keyword">this</span>.id,
    <span class="hljs-keyword">required</span> <span class="hljs-keyword">this</span>.title,
    <span class="hljs-keyword">required</span> <span class="hljs-keyword">this</span>.price,
  });

  <span class="hljs-keyword">factory</span> <span class="hljs-title class_">Product</span>.<span class="hljs-title function_">fromJson</span>(
    <span class="hljs-title class_">Map</span>&lt;<span class="hljs-title class_">String</span>, <span class="hljs-built_in">dynamic</span>&gt; json,
  ) {
    <span class="hljs-keyword">return</span> <span class="hljs-title class_">Product</span>(
      id: json[<span class="hljs-string">&#x27;id&#x27;</span>] <span class="hljs-keyword">as</span> <span class="hljs-built_in">int</span>,
      title: json[<span class="hljs-string">&#x27;title&#x27;</span>] <span class="hljs-keyword">as</span> <span class="hljs-title class_">String</span>,
      price: (json[<span class="hljs-string">&#x27;price&#x27;</span>] <span class="hljs-keyword">as</span> <span class="hljs-built_in">num</span>)
          .<span class="hljs-title function_">toDouble</span>(),
    );
  }
}
</code></pre>
<blockquote>
<p>All casting and conversion live here, not in the UI.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="null-safety--optional-fields">Null Safety &amp; Optional Fields</h1>
<p>Real APIs are often inconsistent.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">factory</span> <span class="hljs-title class_">Product</span>.<span class="hljs-title function_">fromJson</span>(
  <span class="hljs-title class_">Map</span>&lt;<span class="hljs-title class_">String</span>, <span class="hljs-built_in">dynamic</span>&gt; json,
) {
  <span class="hljs-keyword">return</span> <span class="hljs-title class_">Product</span>(
    id: json[<span class="hljs-string">&#x27;id&#x27;</span>] <span class="hljs-keyword">as</span> <span class="hljs-built_in">int?</span> ?? <span class="hljs-number">0</span>,
    title:
        json[<span class="hljs-string">&#x27;title&#x27;</span>] <span class="hljs-keyword">as</span> <span class="hljs-title class_">String</span>? ??
        <span class="hljs-string">&#x27;Unnamed&#x27;</span>,
    price: (json[<span class="hljs-string">&#x27;price&#x27;</span>] <span class="hljs-keyword">as</span> <span class="hljs-built_in">num?</span>)
        ?.<span class="hljs-title function_">toDouble</span>() ?? <span class="hljs-number">0.0</span>,
  );
}
</code></pre>
<p>Rules:</p>
<ul>
<li>use <code>as String?</code>, not <code>as String</code>, for risky fields</li>
<li>provide sensible defaults</li>
<li>never let <code>null</code> explode in the UI</li>
</ul>
<h3 id="question">Question</h3>
<blockquote>
<p>What is the best default when <code>price</code> is missing: <code>0.0</code> or an explicit error?</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="manual-vs-codegen">Manual vs Codegen</h1>
<h3 id="manual-fromjson">Manual <code>fromJson</code></h3>
<ul>
<li>fits Week 4 material</li>
<li>easy to understand</li>
<li>enough for small models</li>
</ul>
<h3 id="codegen-json_serializable--freezed">Codegen (<code>json_serializable</code> / <code>freezed</code>)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-meta">@JsonSerializable</span>()
<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Product</span> </span>{
  <span class="hljs-keyword">final</span> <span class="hljs-built_in">int</span> id;
  <span class="hljs-keyword">final</span> <span class="hljs-title class_">String</span> title;
}
</code></pre>
<ul>
<li>fits large projects</li>
<li>reduces boilerplate</li>
<li>needs <code>build_runner</code></li>
</ul>
<p>For Week 4, the main focus is:</p>
<blockquote>
<p>Understand manual parsing before using generators.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="part-3">Part 3</h1>
<h2 id="dio--requests">Dio &amp; Requests</h2>
<h1 id="why-dio">Why Dio?</h1>
<p>The built-in <code>http</code> is enough, but <code>Dio</code> is more productive.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">http              Dio
  │                 │
  get()             + baseUrl
                    + timeout
                    + interceptor
                    + cancel token
                    + FormData
</code></pre>
<p>Dio advantages:</p>
<ul>
<li>centralized base URL &amp; global timeout</li>
<li>interceptors (auth, log)</li>
<li>typed errors via <code>DioException</code></li>
<li>cleaner query parameters</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="dio-configuration">Dio Configuration</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">final</span> dio = <span class="hljs-title class_">Dio</span>(
  <span class="hljs-title class_">BaseOptions</span>(
    baseUrl:
        <span class="hljs-string">&#x27;https://api.example.com&#x27;</span>,
    connectTimeout: <span class="hljs-keyword">const</span> <span class="hljs-title class_">Duration</span>(
      seconds: <span class="hljs-number">10</span>,
    ),
    receiveTimeout: <span class="hljs-keyword">const</span> <span class="hljs-title class_">Duration</span>(
      seconds: <span class="hljs-number">10</span>,
    ),
    headers: {
      <span class="hljs-string">&#x27;Content-Type&#x27;</span>:
          <span class="hljs-string">&#x27;application/json&#x27;</span>,
    },
  ),
);
</code></pre>
<p><strong>Note:</strong> all requests share the same configuration.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="get-fetch-product-list">GET: Fetch Product List</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-title class_">Future</span>&lt;<span class="hljs-title class_">List</span>&lt;<span class="hljs-title class_">Product</span>&gt;&gt; <span class="hljs-title function_">fetchProducts</span>()
    <span class="hljs-keyword">async</span> {
  <span class="hljs-keyword">final</span> response = <span class="hljs-keyword">await</span> dio.<span class="hljs-title function_">get</span>(
    <span class="hljs-string">&#x27;/products&#x27;</span>,
  );

  <span class="hljs-keyword">final</span> list =
      response.data <span class="hljs-keyword">as</span> <span class="hljs-title class_">List</span>;

  <span class="hljs-keyword">return</span> list
      .<span class="hljs-title function_">map</span>(
        (e) =&gt; <span class="hljs-title class_">Product</span>.<span class="hljs-title function_">fromJson</span>(
          e <span class="hljs-keyword">as</span> <span class="hljs-title class_">Map</span>&lt;<span class="hljs-title class_">String</span>, <span class="hljs-built_in">dynamic</span>&gt;,
        ),
      )
      .<span class="hljs-title function_">toList</span>();
}
</code></pre>
<p>Flow:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">dio.get → response.data → List
  → fromJson → List&lt;Product&gt;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="get-with-query--path">GET with Query &amp; Path</h1>
<p>Query parameters:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">await</span> dio.<span class="hljs-title function_">get</span>(
  <span class="hljs-string">&#x27;/products&#x27;</span>,
  queryParameters: {
    <span class="hljs-string">&#x27;category&#x27;</span>: <span class="hljs-string">&#x27;food&#x27;</span>,
    <span class="hljs-string">&#x27;page&#x27;</span>: <span class="hljs-number">1</span>,
  },
);
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">/products?category=food&amp;page=1
</code></pre>
<p>Path parameter:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">await</span> dio.<span class="hljs-title function_">get</span>(<span class="hljs-string">&#x27;/products/101&#x27;</span>);
</code></pre>
<blockquote>
<p>Avoid manual URL string concatenation when <code>queryParameters</code> works.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="error-handling-with-dio">Error Handling with Dio</h1>
<p>Never use an empty <code>try/catch</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">try</span> {
  <span class="hljs-keyword">final</span> res =
      <span class="hljs-keyword">await</span> dio.<span class="hljs-title function_">get</span>(<span class="hljs-string">&#x27;/products&#x27;</span>);
  <span class="hljs-keyword">return</span> <span class="hljs-title function_">parse</span>(res.data);
} <span class="hljs-keyword">on</span> <span class="hljs-title class_">DioException</span> <span class="hljs-keyword">catch</span> (e) {
  <span class="hljs-keyword">switch</span> (e.type) {
    <span class="hljs-keyword">case</span> <span class="hljs-title class_">DioExceptionType</span>
        .connectionTimeout:
      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">const</span> <span class="hljs-title class_">NetworkFailure</span>(
        <span class="hljs-string">&#x27;Timeout. Check connection.&#x27;</span>,
      );
    <span class="hljs-keyword">case</span> <span class="hljs-title class_">DioExceptionType</span>.badResponse:
      <span class="hljs-keyword">throw</span> <span class="hljs-title class_">ServerFailure</span>(
        <span class="hljs-string">&#x27;Server: <span class="hljs-subst">${e.response?.statusCode}</span>&#x27;</span>,
      );
    <span class="hljs-keyword">default</span>:
      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">const</span> <span class="hljs-title class_">NetworkFailure</span>(
        <span class="hljs-string">&#x27;Failed to load data.&#x27;</span>,
      );
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="remember">Remember!</h1>
<h2 id="user-facing-messages-%E2%89%A0-technical-logs-for-developers">User-facing messages ≠ technical logs for developers.</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="error-types-you-must-handle">Error Types You Must Handle</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">No Internet        → &quot;No connection&quot;
Timeout            → &quot;Request timeout&quot;
401 Unauthorized   → &quot;Session expired, login again&quot;
404 Not Found      → &quot;Data not found&quot;
500 Server Error   → &quot;Server problem&quot;
Parsing Error      → &quot;Invalid data format&quot;
</code></pre>
<p>Status check example:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">if</span> (e.response?.statusCode == <span class="hljs-number">401</span>) {
  <span class="hljs-comment">// refresh token / redirect to login</span>
}
</code></pre>
<h3 id="discussion-1">Discussion</h3>
<blockquote>
<p>When is automatic retry right, and when should we show a &quot;Retry&quot; button?</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="part-4">Part 4</h1>
<h2 id="basic-repository-pattern">Basic Repository Pattern</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="what-is-a-repository">What Is a Repository?</h1>
<p>A repository separates UI from data sources.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">UI (Widget)
   ↓ calls
Provider (Riverpod)
   ↓ uses
Repository
   ↓ uses
Dio / Data Source
   ↓
REST API
</code></pre>
<p>The UI does not know:</p>
<ul>
<li>base URL</li>
<li>Dio</li>
<li>JSON</li>
<li>status codes</li>
</ul>
<p>The UI only knows:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-title class_">Future</span>&lt;<span class="hljs-title class_">List</span>&lt;<span class="hljs-title class_">Product</span>&gt;&gt; <span class="hljs-title function_">getProducts</span>()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="repository-example">Repository Example</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">ProductRepository</span> </span>{
  <span class="hljs-keyword">final</span> <span class="hljs-title class_">Dio</span> dio;

  <span class="hljs-title class_">ProductRepository</span>(<span class="hljs-keyword">this</span>.dio);

  <span class="hljs-title class_">Future</span>&lt;<span class="hljs-title class_">List</span>&lt;<span class="hljs-title class_">Product</span>&gt;&gt; <span class="hljs-title function_">getProducts</span>()
      <span class="hljs-keyword">async</span> {
    <span class="hljs-keyword">final</span> response =
        <span class="hljs-keyword">await</span> dio.<span class="hljs-title function_">get</span>(<span class="hljs-string">&#x27;/products&#x27;</span>);

    <span class="hljs-keyword">final</span> list =
        response.data[<span class="hljs-string">&#x27;data&#x27;</span>] <span class="hljs-keyword">as</span> <span class="hljs-title class_">List</span>;

    <span class="hljs-keyword">return</span> list
        .<span class="hljs-title function_">map</span>(
          (e) =&gt; <span class="hljs-title class_">Product</span>.<span class="hljs-title function_">fromJson</span>(e),
        )
        .<span class="hljs-title function_">toList</span>();
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="benefits">Benefits:</h1>
<ul>
<li>centralized API logic</li>
<li>easy to swap data sources</li>
<li>easy to mock for testing</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="repository--riverpod">Repository + Riverpod</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">final</span> dioProvider = <span class="hljs-title class_">Provider</span>&lt;<span class="hljs-title class_">Dio</span>&gt;(
  (ref) =&gt; <span class="hljs-title class_">Dio</span>(
    <span class="hljs-title class_">BaseOptions</span>(
      baseUrl:
          <span class="hljs-string">&#x27;https://api.example.com&#x27;</span>,
    ),
  ),
);

<span class="hljs-keyword">final</span> productRepoProvider =
    <span class="hljs-title class_">Provider</span>&lt;<span class="hljs-title class_">ProductRepository</span>&gt;(
  (ref) =&gt; <span class="hljs-title class_">ProductRepository</span>(
    ref.<span class="hljs-title function_">watch</span>(dioProvider),
  ),
);

<span class="hljs-keyword">final</span> productsProvider =
    <span class="hljs-title class_">FutureProvider</span>&lt;<span class="hljs-title class_">List</span>&lt;<span class="hljs-title class_">Product</span>&gt;&gt;(
  (ref) =&gt; ref
      .<span class="hljs-title function_">watch</span>(productRepoProvider)
      .<span class="hljs-title function_">getProducts</span>(),
);
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Widget → watch(productsProvider) → Repository → Dio → API
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="part-5">Part 5</h1>
<h2 id="ui-states-loading-error-empty">UI States: Loading, Error, Empty</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="four-mandatory-states">Four Mandatory States</h1>
<p>Every API screen must cover 4 conditions:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Loading → shimmer / spinner
Data    → product list
Empty   → &quot;No products yet&quot;
Error   → message + retry button
</code></pre>
<p>Never leave users guessing:</p>
<ul>
<li>white screen = bug or loading?</li>
<li>empty list = error or truly empty?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="asyncvaluewhen-example"><code>AsyncValue.when</code> Example</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">final</span> state =
    ref.<span class="hljs-title function_">watch</span>(productsProvider);

<span class="hljs-keyword">return</span> state.<span class="hljs-title function_">when</span>(
  loading: () =&gt; <span class="hljs-keyword">const</span> <span class="hljs-title class_">Center</span>(
    child:
        <span class="hljs-title class_">CircularProgressIndicator</span>(),
  ),
  data: (products) {
    <span class="hljs-keyword">if</span> (products.isEmpty) {
      <span class="hljs-keyword">return</span> <span class="hljs-keyword">const</span> <span class="hljs-title class_">Center</span>(
        child: <span class="hljs-title class_">Text</span>(
          <span class="hljs-string">&#x27;No products yet.&#x27;</span>,
        ),
      );
    }
    <span class="hljs-keyword">return</span> <span class="hljs-title class_">ProductList</span>(products);
  },
  error: (e, _) =&gt; <span class="hljs-title class_">ErrorView</span>(
    message: <span class="hljs-string">&#x27;<span class="hljs-subst">$e</span>&#x27;</span>,
    onRetry: () =&gt; ref.<span class="hljs-title function_">invalidate</span>(
      productsProvider,
    ),
  ),
);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="basic-pagination">Basic Pagination</h1>
<p>Large APIs are never sent at once.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">page=1 (10 items) → display
scroll down
page=2 (10 items) → append
...
</code></pre>
<p>Concept:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">await</span> dio.<span class="hljs-title function_">get</span>(
  <span class="hljs-string">&#x27;/products&#x27;</span>,
  queryParameters: {
    <span class="hljs-string">&#x27;page&#x27;</span>: page,
    <span class="hljs-string">&#x27;limit&#x27;</span>: <span class="hljs-number">10</span>,
  },
);
</code></pre>
<p>Pagination states:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">initial → loading more → loaded
                    ↘ error
</code></pre>
<blockquote>
<p>For Week 4: understand <code>page</code> + <code>limit</code> + list append.</p>
</blockquote>
<h1 id="case-study">Case Study</h1>
<h2 id="product-list-from-api">Product List from API</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">ProductListPage
   ↓ watch(productsProvider)
Repository.getProducts()
   ↓ dio.get(&#x27;/products&#x27;)
API → JSON
   ↓ fromJson
List&lt;Product&gt; → UI
</code></pre>
<p>Conditions to demo:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">success → show list
empty   → empty view
timeout → error + retry
offline → connection message
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="anti-patterns">Anti-Patterns</h1>
<p>Avoid:</p>
<h3 id="1-calling-dio-in-build">1. Calling Dio in <code>build()</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">build() → GET → rebuild → GET → loop
</code></pre>
<h3 id="2-parsing-json-in-the-ui">2. Parsing JSON in the UI</h3>
<p>All <code>json['...']</code> belongs in models/repositories.</p>
<h3 id="3-trycatch-that-swallows-errors">3. <code>try/catch</code> that swallows errors</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dart"><span class="hljs-keyword">catch</span> (e) {} <span class="hljs-comment">// user learns nothing</span>
</code></pre>
<h3 id="4-no-timeout">4. No timeout</h3>
<p>Requests hang forever when the server dies.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="ai-lab">AI Lab</h1>
<h2 id="use-ai-as-a-co-developer">Use AI as a Co-Developer</h2>
<p>Example prompt:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">I am building a Flutter app with Dio + Riverpod.

Endpoint: GET https://api.example.com/products
Response: { &quot;data&quot;: [{ &quot;id&quot;: 1, &quot;title&quot;: &quot;...&quot;, &quot;price&quot;: 10000 }] }

Create:
1. Null-safe Product model + fromJson
2. ProductRepository with Dio
3. FutureProvider + UI with loading/error/empty/retry

Explain the reasoning and risks of each part.
</code></pre>
<h3 id="do-not-stop-at-the-ai-output">Do not stop at the AI output.</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="ai-verification-challenge">AI Verification Challenge</h1>
<p>After AI generates the code:</p>
<ol>
<li><strong>Read</strong> — understand model, repository, provider.</li>
<li><strong>Verify</strong> — check base URL, types, null handling.</li>
<li><strong>Run</strong> — turn off the internet, try timeout, try 404.</li>
<li><strong>Test</strong> — empty response, missing fields, server errors.</li>
<li><strong>Refactor</strong> — move parsing to the model, clean error messages.</li>
<li><strong>Explain</strong> — explain the flow without AI.</li>
</ol>
<h3 id="minimum-tests">Minimum tests</h3>
<ul>
<li>airplane mode</li>
<li>field <code>price</code> = <code>null</code></li>
<li><code>data</code> = <code>[]</code></li>
<li>status 500</li>
<li>retry after error</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="group-activity">Group Activity</h1>
<h2 id="code-review--15-minutes">Code Review — 15 Minutes</h2>
<p>Find at least:</p>
<ul>
<li>2 parsing bugs</li>
<li>2 error-handling issues</li>
<li>1 architecture issue (API logic in UI)</li>
<li>1 UI-state issue</li>
<li>1 improvement to the AI-generated code</li>
</ul>
<p>Then answer:</p>
<blockquote>
<p><strong>Is this repository layer production-ready? Why or why not?</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="quick-quiz">Quick Quiz</h1>
<h3 id="1-what-is-the-repository-pattern-for">1. What is the repository pattern for?</h3>
<p>A. Drawing UI<br />
B. Separating UI from data sources<br />
C. Replacing Flutter<br />
D. Speeding up the internet</p>
<h3 id="2-dioexceptiontypebadresponse-means">2. <code>DioExceptionType.badResponse</code> means?</h3>
<p>A. No error<br />
B. Server responded with an error status<br />
C. JSON is always correct<br />
D. The app must close</p>
<h3 id="3-pagination-uses">3. Pagination uses?</h3>
<p>A. <code>page</code> + <code>limit</code><br />
B. One giant request<br />
C. Screenshots<br />
D. Hardcoded data</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="quiz-answers">Quiz Answers</h1>
<h3 id="1-%E2%86%92-b">1 → B</h3>
<p>Repositories separate UI from Dio/JSON/API.</p>
<h3 id="2-%E2%86%92-b">2 → B</h3>
<p><code>badResponse</code> = the server answered, but the status is an error (e.g. 404/500).</p>
<h3 id="3-%E2%86%92-a">3 → A</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">?page=1&amp;limit=10
→ display → page++ → append
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="ai-challenge">AI Challenge</h1>
<p>Use AI to create the <strong>initial version</strong>:</p>
<blockquote>
<p>&quot;Create a repository + provider + UI for a product catalog app from a dummy REST API with loading, empty, error, retry, and basic pagination.&quot;</p>
</blockquote>
<p>Students must then:</p>
<ol>
<li>understand the code</li>
<li>run the code</li>
<li>find at least 2 weaknesses</li>
<li>fix error handling</li>
<li>add their own feature (search/filter)</li>
<li>document manual changes</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="deliverables">Deliverables</h1>
<h2 id="repository">Repository</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">week-04-networking-rest-api/
├── lib/
├── test/
├── README.md
└── screenshots/
</code></pre>
<p>README must contain at least:</p>
<ul>
<li>app description &amp; API used</li>
<li>models/repositories/providers used</li>
<li>loading/data/empty/error screenshots</li>
<li>how to run</li>

<li>main prompt</li>
<li>manual changes</li>
<li>issues found and testing results</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h2 id="pre-submission-checklist">Pre-Submission Checklist</h2>
<h3 id="data">Data</h3>
<ul>
<li>[ ] Null-safe <code>fromJson</code> model</li>
<li>[ ] Repository separates UI from Dio</li>
<li>[ ] Timeout configured</li>
<li>[ ] Basic pagination understood</li>
</ul>
<h3 id="ui">UI</h3>
<ul>
<li>[ ] Loading / Data / Empty / Error render correctly</li>
<li>[ ] Retry button works</li>
<li>[ ] No requests in <code>build()</code></li>
</ul>
<h3 id="ai">AI</h3>
<ul>
<li>[ ] Prompt documented &amp; AI output verified</li>
<li>[ ] Manual changes present</li>
<li>[ ] Code understood by student</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="exit-ticket">Exit Ticket</h1>
<p>Answer before the class ends:</p>
<h3 id="1-what-is-the-difference-between">1. What is the difference between:</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">http
vs
Dio
</code></pre>
<h3 id="2-what-are-the-roles-of">2. What are the roles of:</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Model
vs
Repository
</code></pre>
<h3 id="3-name-the-4-mandatory-api-screen-states-with-ui-examples">3. Name the 4 mandatory API screen states with UI examples.</h3>
<h3 id="4-why-must-ai-error-handling-still-be-tested-manually">4. Why must AI error handling still be tested manually?</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="key-takeaways">Key Takeaways</h1>
<h2 id="networking">Networking</h2>
<blockquote>
<p>Dio makes HTTP requests more structured.</p>
</blockquote>
<h2 id="architecture">Architecture</h2>
<blockquote>
<p>Repositories separate UI from data sources.</p>
</blockquote>
<h2 id="ui-state">UI State</h2>
<blockquote>
<p>Loading/Data/Empty/Error must be explicit.</p>
</blockquote>
<h2 id="ai-1">AI</h2>
<blockquote>
<p>AI drafts the initial repository.<br />
<strong>Developers test error handling and fix it.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="next-week">Next Week</h1>
<h2 id="week-5-local-storage--offline-first">Week 5: Local Storage &amp; Offline First</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">REST API
   ↓
Repository
   ↓
Cache (Hive / SQLite)
   ↓
UI still works offline
</code></pre>
<h3 id="target">Target</h3>
<blockquote>
<p>Apps stay useful without internet through caching and basic sync.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:default;" data-marpit-pagination-total="43" data-size="16:9">
<h1 id="build-%E2%86%92-verify-%E2%86%92-explain">Build → Verify → Explain</h1>
<h2 id="mobile-learning-principle">Mobile Learning Principle</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">        AI
         ↓
      Generate
         ↓
      Developer
         ↓
       Verify
         ↓
        Test
         ↓
      Refactor
         ↓
       Explain
</code></pre>
<h2 id="dont-just-call-apis">Don't just call APIs.</h2>
<h3 id="become-a-developer-who-understands-the-data-flow-being-called">Become a developer who understands the data flow being called.</h3>
</section>
